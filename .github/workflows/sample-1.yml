### Multiple jobs in a workflow

name: cowsay workflow multi-jobs

on: push

jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cowsay Program
        run: sudo apt-get install cowsay -y

      - name: Execute Cowsay CMD
        run: cowsay -f dragon "Just be aware, the lion is still the jungle king" >> lion.txt

      - name: Upload lion.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: lion
          path: lion.txt

  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
      - name: Download lion.txt artifact
        uses: actions/download-artifact@v4
        with:
          name: lion

      - name: Test file contains 'lion'
        run: grep -i "lion" lion.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest
    steps:
      - name: Download lion.txt artifact
        uses: actions/download-artifact@v4
        with:
          name: lion

      - name: Output lion.txt contents
        run: cat lion.txt

      - name: Deploy step
        run: echo Deploying files