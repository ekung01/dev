name: My cowsay workflow executed with script

on: push

jobs:
  starter_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -ltra

      - name: Verify ascii-script.sh exists
        run: |
          if [ ! -f ./ascii-script.sh ]; then
            echo "ascii-script.sh not found!" >&2
            exit 1
          fi

      - name: Make ascii-script.sh executable and execute
        run: |
          chmod +x ascii-script.sh
          ./ascii-script.sh
