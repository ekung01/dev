name: My cowsay workflow

on: push

jobs:
    starter_job:
        runs-on: ubuntu-latest
        steps:
        - name: checkout Repo
          uses: actions/checkout@v4        

        - name: list and multi-command with cowsaymsge
          run: |
            echo "Actions usage with multiple commands"
            ls -ltra
            cat README.md

        - name: Install cowsay
          run: sudo apt-get update && sudo apt-get install -y cowsay

        - name: Add cowsay to PATH
          run: echo "/usr/games" >> $GITHUB_PATH

        - name: Run cowsay
          run: |
            cowsay -f dragon "Just be aware, I am still the jungle king" >> lion.txt

        - name: Display content of lion.txt
          run: cat lion.txt
