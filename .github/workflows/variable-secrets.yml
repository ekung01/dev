name: Using environment variable at the workflow level

on:
    push

env:
        CONTAINER_REGISTRY: docker.io
        DOCKER_USERNAME: manlook01
        DOCKER_IMAGE: github-actios-nginex

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: docker Build
              run: docker build -t ${{ env.CONTAINER_REGISTRY }}/$DOCKER_USERNAME/$IMAGE_NAME:latest

            - name: Docker login
              env:
                DOCKER_PASSWORD: 308VtasYw!
              run: docker login --username=$DOCKER_USERNAME --password=DOCKER_PASSWORD

            - name: docker publish
              run: echo docker $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
        - name: Docker Run
          run: docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest